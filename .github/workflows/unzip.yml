name: Unzip website
on:
  push:
    paths:
      - 'kaisi-site.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip into repo root and commit
        run: |
          unzip -o kaisi-site.zip -d .
          git rm -q kaisi-site.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Unzip website files from kaisi-site.zip"
          git push
